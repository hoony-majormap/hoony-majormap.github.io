<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>터치밀 — Phase 1 화면 프로토타입 (영양사 + 어드민)</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
/* ============================================================
   터치밀 Phase 1 — 디자인 시스템 v0.2 (기획서 §1, §8.5)
   ============================================================ */
:root{
  /* 컬러 토큰 */
  --primary-700:#15803D; --primary-600:#16A34A; --primary-50:#F0FDF4;
  --gray-900:#111827; --gray-700:#374151; --gray-500:#6B7280;
  --gray-200:#E5E7EB; --gray-100:#F3F4F6; --gray-50:#F9FAFB;
  --warning:#F59E0B; --warning-50:#FFFBEB;
  --danger:#DC2626; --danger-50:#FEF2F2;
  --info:#3B82F6; --info-50:#EFF6FF;
  --white:#FFFFFF;
  /* 간격 스케일 4·8·12·16·24·32·48·64 */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px; --s16:64px;
  --radius:10px; --radius-sm:6px; --radius-lg:14px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06);
  --shadow-md:0 4px 12px rgba(16,24,40,.10);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16);
  --font:'Pretendard Variable',system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);color:var(--gray-700);background:var(--gray-50);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--gray-200);border-radius:6px;border:2px solid var(--gray-50)}

/* 타이포 */
h1{font-size:24px;font-weight:700;color:var(--gray-900);letter-spacing:-.01em}
h2{font-size:18px;font-weight:600;color:var(--gray-900)}
h3{font-size:16px;font-weight:600;color:var(--gray-900)}
.caption{font-size:12px;color:var(--gray-500)}
.kpi-num{font-size:28px;font-weight:700;color:var(--gray-900);letter-spacing:-.02em}

/* ===== 공통 컴포넌트 ===== */
.btn{display:inline-flex;align-items:center;gap:6px;font-weight:600;border-radius:var(--radius-sm);
  transition:all .12s;white-space:nowrap;border:1px solid transparent}
.btn-sm{padding:6px 10px;font-size:13px}
.btn-md{padding:9px 16px;font-size:14px}
.btn-lg{padding:12px 22px;font-size:15px}
.btn-primary{background:var(--primary-600);color:#fff}
.btn-primary:hover{background:var(--primary-700)}
.btn-secondary{background:#fff;color:var(--gray-700);border-color:var(--gray-200)}
.btn-secondary:hover{border-color:var(--gray-500);background:var(--gray-50)}
.btn-ghost{background:transparent;color:var(--gray-700)}
.btn-ghost:hover{background:var(--gray-100)}
.btn-danger{background:var(--danger);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;
  padding:2px 8px;border-radius:999px;line-height:1.6}
.tag-cat{background:var(--gray-100);color:var(--gray-700)}
.tag-allergy{background:var(--danger-50);color:var(--danger)}
.tag-status-ok{background:var(--primary-50);color:var(--primary-700)}
.tag-status-warn{background:var(--warning-50);color:#B45309}
.tag-status-info{background:var(--info-50);color:var(--info)}
.tag-status-danger{background:var(--danger-50);color:var(--danger)}

.card{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);box-shadow:var(--shadow-sm)}
.card-pad{padding:var(--s6)}
.card-click{cursor:pointer;transition:all .12s}
.card-click:hover{box-shadow:var(--shadow-md);border-color:var(--gray-200)}
.card-click:active{border-color:var(--primary-600)}

.input,select.input{width:100%;padding:9px 12px;border:1px solid var(--gray-200);
  border-radius:var(--radius-sm);background:#fff;color:var(--gray-900);transition:border .12s}
.input:focus{outline:none;border-color:var(--primary-600);box-shadow:0 0 0 3px var(--primary-50)}
.field-label{display:block;font-size:13px;font-weight:600;color:var(--gray-700);margin-bottom:6px}

table.dt{width:100%;border-collapse:collapse;font-size:14px}
table.dt thead th{position:sticky;top:0;background:var(--gray-50);z-index:2;
  text-align:left;font-size:12px;font-weight:600;color:var(--gray-500);
  padding:10px 14px;border-bottom:1px solid var(--gray-200);white-space:nowrap}
table.dt tbody td{padding:11px 14px;border-bottom:1px solid var(--gray-100);color:var(--gray-700)}
table.dt tbody tr{transition:background .1s}
table.dt tbody tr:hover{background:var(--gray-50)}
table.dt .num{font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
.row-click{cursor:pointer}

kbd{font-family:var(--font);font-size:11px;font-weight:600;color:var(--gray-700);
  background:var(--gray-100);border:1px solid var(--gray-200);border-bottom-width:2px;
  border-radius:4px;padding:1px 6px}

/* 애니메이션 토큰 §8.5 */
@keyframes pulseOnce{0%{background:var(--primary-50);box-shadow:0 0 0 0 rgba(22,163,74,.4)}
  100%{background:transparent;box-shadow:0 0 0 8px rgba(22,163,74,0)}}
.pulse-once{animation:pulseOnce .6s ease-out}
@keyframes fillAnim{0%{transform:scale(.92);opacity:0}100%{transform:scale(1);opacity:1}}
.fill-anim{animation:fillAnim .5s cubic-bezier(.2,.8,.2,1)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .8s linear infinite}
@keyframes shimmer{0%{background-position:-400px 0}100%{background-position:400px 0}}
.skeleton{background:linear-gradient(90deg,var(--gray-100) 25%,var(--gray-200) 37%,var(--gray-100) 63%);
  background-size:800px 100%;animation:shimmer 1.4s infinite;border-radius:6px}

.diff-add{background:var(--primary-50);border-left:3px solid var(--primary-600)}
.diff-del{background:var(--danger-50);border-left:3px solid var(--danger);text-decoration:line-through;color:var(--gray-500)}
.diff-mod{background:var(--warning-50);border-left:3px solid var(--warning)}

/* ===== 앱 셸 ===== */
#app{display:flex;flex-direction:column;height:100vh;overflow:hidden}
.topbar{display:flex;align-items:center;gap:16px;height:56px;padding:0 20px;
  background:#fff;border-bottom:1px solid var(--gray-200);flex-shrink:0;z-index:50}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--gray-900)}
.brand .logo{width:28px;height:28px;border-radius:8px;background:var(--primary-600);
  display:grid;place-items:center;color:#fff;font-size:15px}
.mode-switch{display:flex;background:var(--gray-100);border-radius:999px;padding:3px}
.mode-switch button{padding:6px 16px;border-radius:999px;font-size:13px;font-weight:600;color:var(--gray-500)}
.mode-switch button.active{background:#fff;color:var(--primary-700);box-shadow:var(--shadow-sm)}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:var(--primary-50);color:var(--primary-700);
  display:grid;place-items:center;font-weight:700;font-size:13px;border:1px solid var(--gray-200)}

.body{display:flex;flex:1;overflow:hidden}
/* 영양사 좌측 네비 */
.sidenav{width:212px;background:#fff;border-right:1px solid var(--gray-200);
  padding:16px 12px;flex-shrink:0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
  font-weight:600;font-size:14px;color:var(--gray-700);cursor:pointer;margin-bottom:2px;min-height:44px}
.nav-item .ic{width:20px;text-align:center;font-size:16px}
.nav-item:hover{background:var(--gray-50)}
.nav-item.active{background:var(--primary-50);color:var(--primary-700)}
.nav-section{font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;
  letter-spacing:.04em;padding:14px 12px 6px}
/* 어드민 상단 가로 네비 */
.adminnav{display:flex;gap:4px;padding:0 20px;background:#fff;border-bottom:1px solid var(--gray-200);flex-shrink:0}
.adminnav button{padding:14px 16px;font-weight:600;font-size:14px;color:var(--gray-500);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.adminnav button.active{color:var(--primary-700);border-bottom-color:var(--primary-600)}
.adminnav button:hover{color:var(--gray-900)}

.main{flex:1;overflow-y:auto;padding:24px 28px}
.page{max-width:1180px;margin:0 auto}
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:20px}
.page-head .sub{color:var(--gray-500);font-size:14px;margin-top:4px}
.page-head .actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}

.grid{display:grid;gap:16px}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{grid-template-columns:repeat(5,1fr)}
.g2-3{grid-template-columns:1.6fr 1fr}
@media(max-width:1080px){.g4,.g5{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr}}

/* 배너 */
.banner{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--radius);
  margin-bottom:20px;cursor:pointer}
.banner .ic{font-size:20px}
.banner-warn{background:linear-gradient(90deg,#FFFBEB,#FEF3C7);border:1px solid #FDE68A;color:#92400E}
.banner-danger{background:linear-gradient(90deg,#FEF2F2,#FEE2E2);border:1px solid #FECACA;color:#991B1B}
.banner-info{background:var(--info-50);border:1px solid #BFDBFE;color:#1E40AF}

/* KPI 카드 */
.kpi{padding:18px 20px}
.kpi .lbl{font-size:13px;color:var(--gray-500);font-weight:600;display:flex;align-items:center;gap:6px}
.kpi .val{margin-top:8px;display:flex;align-items:baseline;gap:8px}
.kpi .delta{font-size:12px;font-weight:600}
.delta-up{color:var(--primary-600)} .delta-down{color:var(--danger)}
.kpi .target{font-size:11px;color:var(--gray-500);margin-top:6px}

/* 식단표 그리드 */
.menu-wrap{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius);overflow:hidden}
.menu-toolbar{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--gray-200)}
.weeknav{display:flex;align-items:center;gap:6px;font-weight:600;font-size:15px;color:var(--gray-900)}
.weeknav button{width:32px;height:32px;border-radius:var(--radius-sm);color:var(--gray-700)}
.weeknav button:hover{background:var(--gray-100)}
.menu-grid{display:grid;grid-template-columns:64px repeat(7,1fr);font-size:13px}
.menu-grid .gh{background:var(--gray-50);font-weight:600;color:var(--gray-700);padding:8px 6px;
  text-align:center;border-bottom:1px solid var(--gray-200);border-right:1px solid var(--gray-100);
  position:sticky;top:0}
.menu-grid .gh .d{font-size:11px;color:var(--gray-500);font-weight:500}
.menu-grid .rowlbl{background:var(--gray-50);font-weight:600;color:var(--gray-700);
  display:grid;place-items:center;border-right:1px solid var(--gray-200);border-bottom:1px solid var(--gray-100);font-size:12px}
.mcell{border-right:1px solid var(--gray-100);border-bottom:1px solid var(--gray-100);
  padding:5px;min-height:64px;display:flex;flex-direction:column;gap:4px}
.weekend{background:#FCFCFD}
.mcard{background:#fff;border:1px solid var(--gray-200);border-radius:6px;padding:6px 8px;
  font-size:12px;line-height:1.45;cursor:pointer;transition:all .1s;position:relative}
.mcard:hover{border-color:var(--primary-600);box-shadow:var(--shadow-sm)}
.mcard .meta{display:flex;align-items:center;gap:4px;margin-top:3px;color:var(--gray-500);font-size:11px}
.mcard .warn-dot{position:absolute;top:5px;right:5px;color:var(--danger);font-size:11px}
.cell-empty{border:1.5px dashed var(--gray-200);border-radius:6px;flex:1;min-height:54px;
  display:grid;place-items:center;color:var(--gray-500);font-size:12px;cursor:pointer;transition:all .1s}
.cell-empty:hover{border-color:var(--primary-600);background:var(--primary-50);color:var(--primary-700)}
.kcal-row .rowlbl{background:#F0FDF4;color:var(--primary-700)}
.kcal-cell{text-align:center;padding:8px 4px;font-weight:600;color:var(--gray-700);
  background:#F0FDF4;border-right:1px solid var(--gray-100);font-variant-numeric:tabular-nums}

/* 드로어 */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.32);backdrop-filter:blur(1px);
  opacity:0;pointer-events:none;transition:opacity .2s;z-index:60}
.scrim.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:480px;max-width:92vw;background:#fff;
  box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  z-index:70;display:flex;flex-direction:column}
.drawer.show{transform:translateX(0)}
.drawer-head{padding:18px 20px;border-bottom:1px solid var(--gray-200)}
.drawer-head .close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:var(--radius-sm);
  color:var(--gray-500);font-size:18px}
.drawer-head .close:hover{background:var(--gray-100)}
.drawer-body{flex:1;overflow-y:auto;padding:18px 20px}
.drawer-foot{padding:14px 20px;border-top:1px solid var(--gray-200);display:flex;gap:8px;justify-content:flex-end}

/* 모달 */
.modal-scrim{position:fixed;inset:0;background:rgba(17,24,39,.4);display:grid;place-items:center;
  opacity:0;pointer-events:none;transition:opacity .18s;z-index:80;padding:20px}
.modal-scrim.show{opacity:1;pointer-events:auto}
.modal{background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);width:520px;max-width:100%;
  transform:scale(.96);transition:transform .18s}
.modal-scrim.show .modal{transform:scale(1)}
.modal-head{padding:18px 22px;border-bottom:1px solid var(--gray-200)}
.modal-body{padding:20px 22px;max-height:60vh;overflow-y:auto}
.modal-foot{padding:14px 22px;border-top:1px solid var(--gray-200);display:flex;gap:8px;justify-content:flex-end}

/* AI 오버레이 */
.ai-overlay{position:fixed;inset:0;background:rgba(17,24,39,.55);backdrop-filter:blur(4px);
  display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .2s;z-index:90}
.ai-overlay.show{opacity:1;pointer-events:auto}
.ai-box{background:#fff;border-radius:var(--radius-lg);padding:34px 40px;text-align:center;width:380px;box-shadow:var(--shadow-lg)}
.ai-ring{width:48px;height:48px;border:4px solid var(--primary-50);border-top-color:var(--primary-600);
  border-radius:50%;margin:0 auto 18px}
.ai-step{font-size:15px;font-weight:600;color:var(--gray-900);min-height:22px}
.ai-prog{height:6px;background:var(--gray-100);border-radius:3px;margin-top:18px;overflow:hidden}
.ai-prog>i{display:block;height:100%;background:var(--primary-600);width:0;transition:width .4s}

/* 토스트 §공통: 하단 우측 */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:120}
.toast{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:var(--radius);
  box-shadow:var(--shadow-lg);font-size:14px;font-weight:500;min-width:240px;
  transform:translateY(20px);opacity:0;transition:all .25s}
.toast.show{transform:translateY(0);opacity:1}
.toast-success{background:var(--primary-700);color:#fff}
.toast-info{background:var(--gray-900);color:#fff}
.toast-warn{background:var(--warning);color:#fff}

/* 차트 */
.spark{display:inline-flex;align-items:flex-end;gap:2px;height:24px}
.spark i{width:4px;background:var(--primary-600);border-radius:1px;opacity:.5}
.spark i:last-child{opacity:1}
.linechart{width:100%;height:200px}
.barwk{display:flex;align-items:flex-end;gap:3px;height:34px}
.barwk i{flex:1;background:var(--primary-600);border-radius:2px;min-height:3px}
.barwk i.empty{background:var(--gray-200)}

.timeline{list-style:none}
.timeline li{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-100)}
.timeline li:last-child{border:none}
.tl-dot{width:9px;height:9px;border-radius:50%;margin-top:6px;flex-shrink:0;background:var(--primary-600)}
.tl-dot.info{background:var(--info)} .tl-dot.warn{background:var(--warning)}

.issue-list{list-style:none}
.issue-list li{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--gray-100);cursor:pointer}
.issue-list li:hover{background:var(--gray-50);margin:0 -12px;padding:12px 12px;border-radius:8px}
.issue-list li:last-child{border:none}

.help-line{font-size:12px;color:var(--gray-500)}
.divider{height:1px;background:var(--gray-200);margin:18px 0}
.flex{display:flex} .between{justify-content:space-between} .center{align-items:center}
.mt2{margin-top:8px}.mt3{margin-top:12px}.mt4{margin-top:16px}.mb2{margin-bottom:8px}.mb4{margin-bottom:16px}
.muted{color:var(--gray-500)} .strong{font-weight:600;color:var(--gray-900)}
.hide{display:none!important}
.saved-chip{font-size:12px;color:var(--gray-500);display:flex;align-items:center;gap:6px}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--primary-600)}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><span class="logo">🍱</span> 터치밀 <span class="caption" style="font-weight:500;color:var(--gray-500)">Phase 1</span></div>
    <div class="mode-switch">
      <button id="m-nutri" class="active" onclick="setMode('nutri')">영양사</button>
      <button id="m-admin" onclick="setMode('admin')">어드민</button>
    </div>
    <div class="topbar-right">
      <span class="caption" id="ctx-label">사랑가득요양원 · 입소자 86명</span>
      <span class="avatar" id="avatar">황</span>
    </div>
  </div>

  <!-- 어드민 가로 네비 -->
  <div class="adminnav hide" id="adminnav">
    <button data-screen="A-02" class="active" onclick="go('A-02')">전체 현황</button>
    <button data-screen="A-08" onclick="go('A-08')">AI 평가·품질</button>
  </div>

  <div class="body">
    <!-- 영양사 좌측 네비 -->
    <nav class="sidenav" id="sidenav">
      <div class="nav-section">작업</div>
      <div class="nav-item active" data-screen="N-02" onclick="go('N-02')"><span class="ic">🏠</span> 대시보드</div>
      <div class="nav-item" data-screen="N-03" onclick="go('N-03')"><span class="ic">📅</span> 주간 식단표</div>
      <div class="nav-item" data-screen="N-05" onclick="go('N-05')"><span class="ic">🧾</span> 발주서</div>
      <div class="nav-section">관리</div>
      <div class="nav-item" onclick="toast('인원 관리는 다음 화면입니다 (N-07)','info')"><span class="ic">👥</span> 인원 관리</div>
      <div class="nav-item" onclick="toast('설정은 다음 화면입니다 (N-09)','info')"><span class="ic">⚙️</span> 설정</div>
    </nav>

    <main class="main" id="main"></main>
  </div>
</div>

<!-- 드로어 / 모달 / 오버레이 / 토스트 마운트 -->
<div class="scrim" id="scrim" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="modal-scrim" id="modalScrim" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div>
<div class="ai-overlay" id="aiOverlay"><div class="ai-box">
  <div class="ai-ring spin"></div>
  <div class="ai-step" id="aiStep">제철 식재료 분석 중…</div>
  <div class="ai-prog"><i id="aiProg"></i></div>
</div></div>
<div id="toasts"></div>

<script>
/* ============================================================
   상태 & 데이터
   ============================================================ */
const DAYS=['일','월','화','수','목','금','토'];
const DATES=['2/1','2/2','2/3','2/4','2/5','2/6','2/7'];
const MEALS=['조식','오전간식','중식','오후간식','석식'];
let MODE='nutri', SCREEN='N-02';

// 메뉴 데이터 (식단표) — null = 빈 칸
function seedMenu(){
  const g={};
  MEALS.forEach(m=>g[m]=Array(7).fill(null));

function renderRecRows(){
  const tb=document.getElementById('recRows'); if(!tb)return;
  tb.innerHTML=DRAWER_CTX.rows.map((r,idx)=>{
    const total=(r.g*PEOPLE/1000).toFixed(1);
    const order=Math.ceil(r.g*PEOPLE/1000*10)/10;
    return `<tr>
      <td>${r.item}</td>
      <td class="num"><input value="${r.g}" data-idx="${idx}" oninput="onGram(this)"
        style="width:54px;text-align:right;padding:4px 6px;border:1px solid var(--gray-200);border-radius:5px"></td>
      <td class="num">${total} kg</td>
      <td class="num" id="ord-${idx}">${order} ${r.unit}</td>
      <td style="text-align:right"><button class="btn btn-ghost btn-sm" onclick="delRow(${idx})" title="삭제">🗑</button></td>
    </tr>`;
  }).join('');
  recalcCost();
}
function onGram(inp){
  const idx=+inp.dataset.idx; const v=Math.max(0,+inp.value||0);
  DRAWER_CTX.rows[idx].g=v;
  const r=DRAWER_CTX.rows[idx];
  const total=(v*PEOPLE/1000).toFixed(1);
  const order=Math.ceil(v*PEOPLE/1000*10)/10;
  const cell=inp.closest('tr').children[2]; cell.textContent=total+' kg';
  const oc=document.getElementById('ord-'+idx);
  oc.textContent=order+' '+r.unit;
  oc.classList.remove('pulse-once'); void oc.offsetWidth; oc.classList.add('pulse-once');
  recalcCost();
}
function recalcCost(){
  // 단가 가정(원/kg)으로 예상 재료비 계산
  const price={'백미':2800,'소고기 양지':18000,'무':1200,'돈사태':9500,'고추장':6000,'배추김치':4000,'두부':3500,'대파':3000};
  const total=DRAWER_CTX.rows.reduce((a,r)=>a+(price[r.item]||4000)*(r.g*PEOPLE/1000),0);
  const el=document.getElementById('costOut'); if(el)el.textContent='₩'+Math.round(total).toLocaleString();
}
function addRow(inp){
  const name=inp.value.trim(); if(!name)return;

}

/* ====== 차트 (Canvas 라인) ====== */
function lineChart(id,series,opts){
  const cv=document.getElementById(id); if(!cv)return;
  const dpr=window.devicePixelRatio||1, W=cv.clientWidth, H=cv.clientHeight;
  cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext('2d'); c.scale(dpr,dpr);
  c.clearRect(0,0,W,H);
  const pad={l:34,r:14,t:14,b:24}, iw=W-pad.l-pad.r, ih=H-pad.t-pad.b;
  const all=series.flatMap(s=>s.data); const min=opts.min??Math.min(...all)*.95, max=opts.max??Math.max(...all)*1.02;
  const x=i=>pad.l+iw*i/(opts.labels.length-1), y=v=>pad.t+ih*(1-(v-min)/(max-min));
  // grid
  c.strokeStyle='#E5E7EB'; c.lineWidth=1; c.font='11px sans-serif'; c.fillStyle='#6B7280';
  for(let g=0;g<=4;g++){const yy=pad.t+ih*g/4; c.beginPath();c.moveTo(pad.l,yy);c.lineTo(W-pad.r,yy);c.stroke();
    c.fillText(Math.round(max-(max-min)*g/4),4,yy+3);}
  opts.labels.forEach((l,i)=>c.fillText(l,x(i)-8,H-6));
  // deploy marker
  if(opts.marker!=null){const mx=x(opts.marker);c.strokeStyle='#F59E0B';c.setLineDash([4,4]);
    c.beginPath();c.moveTo(mx,pad.t);c.lineTo(mx,pad.t+ih);c.stroke();c.setLineDash([]);}
  series.forEach(s=>{
    c.strokeStyle=s.color;c.lineWidth=2.5;c.beginPath();
    s.data.forEach((v,i)=>{i?c.lineTo(x(i),y(v)):c.moveTo(x(i),y(v))});c.stroke();
    c.fillStyle=s.color;s.data.forEach((v,i)=>{c.beginPath();c.arc(x(i),y(v),3.5,0,7);c.fill();});
  });
}

function closeDrawer(){document.getElementById('drawer').classList.remove('show');

function openModal(title,bodyText,actions,bodyHTML){
  const m=document.getElementById('modal');
  m.innerHTML=`<div class="modal-head"><h2>${title}</h2></div>
    <div class="modal-body">${bodyHTML||('<p>'+bodyText+'</p>')}</div>
    <div class="modal-foot" id="mfoot"></div>`;
  const f=m.querySelector('#mfoot');
  (actions||[{label:'확인',cls:'btn-primary',fn:closeModal}]).forEach(a=>{
    const b=document.createElement('button');b.className='btn '+a.cls+' btn-md';b.textContent=a.label;
    b.onclick=a.fn;f.appendChild(b);});
  document.getElementById('modalScrim').classList.add('show');
}
function closeModal(){document.getElementById('modalScrim').classList.remove('show');}
let toastSeq=0;
function toast(msg,type){
  const t=document.createElement('div');t.className='toast toast-'+(type||'info');
  const ic={success:'✅',info:'ℹ️',warn:'⚠️'}[type||'info'];
  t.innerHTML=`<span>${ic}</span><span>${msg}</span>`;
  document.getElementById('toasts').appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>t.remove(),300)},3600);
}
