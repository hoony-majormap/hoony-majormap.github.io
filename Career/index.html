<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>메이저맵 커리어사관학교 · MVP</title>
<style>
:root{--ink:#1f2730;--mut:#6b7682;--line:#dde3ea;--navy:#1f3864;--blue:#2e75b6;--bg:#eef1f5;--soft:#f5f7fa;--ok:#3a8a4d;--warn:#c0563b;--gold:#caa64a}
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","맑은 고딕",system-ui,sans-serif;background:var(--bg);color:var(--ink)}
.top{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:20}
.top b{font-size:15px}.top .tag{font-size:11px;background:rgba(255,255,255,.18);padding:2px 8px;border-radius:10px}
.top .sp{margin-left:auto;display:flex;gap:8px}
.top button{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:8px;padding:5px 11px;font-size:12px;cursor:pointer}
.wrap{max-width:1060px;margin:16px auto;padding:0 14px;display:grid;grid-template-columns:210px 1fr;gap:14px}
.rail{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 10px;align-self:start;position:sticky;top:64px}
.brand{font-weight:800;color:var(--navy);font-size:13px;padding:4px 8px 12px;border-bottom:1px dashed var(--line);margin-bottom:8px}
.brand small{display:block;font-weight:500;color:var(--mut);font-size:10.5px;margin-top:3px}
.nav{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:9px;cursor:pointer;font-size:13px;color:#3a4452;margin-bottom:2px}
.nav:hover{background:#eef2f7}.nav.active{background:var(--navy);color:#fff;font-weight:700}
.nav .st{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:10px;flex:none;background:#fff;color:var(--mut)}
.nav.done .st{background:var(--ok);border-color:var(--ok);color:#fff}.nav.active .st{background:#fff;color:var(--navy);border-color:#fff}
.rprog{margin-top:12px;font-size:11px;color:var(--mut)}
.rprog .bar{height:7px;background:#e6eaf0;border-radius:6px;overflow:hidden;margin-top:4px}.rprog .bar>i{display:block;height:100%;background:var(--blue);transition:.3s}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px;min-height:560px}
.h{display:flex;align-items:flex-end;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:8px}
.h .step{font-size:11px;color:#fff;background:var(--blue);border-radius:6px;padding:2px 8px;font-weight:700}
.h h2{margin:0;font-size:19px;color:var(--navy)}
.goal{color:#3a4452;font-size:13px;margin:8px 0}
.msg{background:#eef4fb;border-left:4px solid var(--blue);padding:10px 12px;border-radius:6px;font-size:12.5px;color:#2b4664;margin:10px 0}
.lbl{font-size:11px;color:var(--mut);font-weight:700;margin:14px 0 5px}
label.q{display:block;font-size:13px;margin:10px 0 4px;color:#2b3540}
input[type=text],textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;font-family:inherit;background:var(--soft)}
textarea{min-height:60px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:140px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:6px 0}
.chip{font-size:12px;border:1px solid var(--line);border-radius:18px;padding:6px 12px;color:#46505e;background:#fff;cursor:pointer;user-select:none}
.chip.sel{background:#e7f0fb;border-color:var(--blue);color:var(--navy);font-weight:700}
.chk{display:flex;align-items:center;gap:9px;font-size:13px;padding:7px 0;border-bottom:1px dotted var(--line);cursor:pointer}
.chk input{width:16px;height:16px}
.scaleopt{display:flex;gap:6px;margin-left:auto}
.scaleopt span{font-size:11px;border:1px solid var(--line);border-radius:12px;padding:2px 9px;color:var(--mut);cursor:pointer}
.scaleopt span.on{background:var(--navy);color:#fff;border-color:var(--navy)}
table{width:100%;border-collapse:collapse;margin:8px 0;font-size:12.5px}
th{background:var(--navy);color:#fff;font-weight:600;padding:7px;text-align:left;font-size:11.5px}
td{border:1px solid var(--line);padding:6px;vertical-align:top}
td input,td textarea{background:#fff;border:1px dashed var(--line)}
.btn{font-size:13px;border-radius:9px;padding:9px 16px;cursor:pointer;border:1px solid var(--line);background:#fff;color:#46505e}
.btn:hover{background:#f1f4f8}
.btn.p{background:var(--blue);color:#fff;border-color:var(--blue);font-weight:700}
.btn.g{background:var(--ok);color:#fff;border-color:var(--ok);font-weight:700}
.acts{display:flex;gap:8px;margin-top:18px;border-top:1px solid var(--line);padding-top:14px;align-items:center;flex-wrap:wrap}
.acts .sp{margin-left:auto}
.saved{font-size:11.5px;color:var(--ok)}
.jobcard{border:1px solid var(--line);border-radius:11px;padding:12px;margin:8px 0;background:#fff}
.jobcard h4{margin:0 0 4px;font-size:14px;color:var(--navy)}
.jobcard .meta{font-size:11px;color:var(--mut);margin:2px 0}
.jobcard .score{float:right;background:var(--navy);color:#fff;border-radius:10px;padding:2px 9px;font-size:11px;font-weight:700}
.tagm{display:inline-block;font-size:10.5px;border-radius:10px;padding:1px 7px;margin:2px 3px 0 0;background:#eef2f7;color:#46505e}
.ai{border:1px dashed var(--blue);background:#f3f8ff;border-radius:11px;padding:12px;margin:12px 0}
.ai h4{margin:0 0 6px;font-size:13px;color:var(--blue)}
.ai .out{font-size:12.5px;color:#33475e;line-height:1.65;background:#fff;border:1px solid #d9e6f5;border-radius:7px;padding:10px;white-space:pre-wrap}
.ai .caution{font-size:11px;color:var(--warn);margin-top:8px}
.badgepop{text-align:center;padding:26px 10px}
.seal{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;background:radial-gradient(circle at 50% 38%,#3e6bb0,#1f3864);display:grid;place-items:center;color:#fff;box-shadow:0 8px 22px rgba(31,56,100,.35);border:5px solid var(--gold);font-weight:800;font-size:13px;line-height:1.3;padding:0 10px}
.cert{border:3px double var(--navy);border-radius:14px;padding:28px;text-align:center;background:linear-gradient(180deg,#fff,#f7f9fc)}
.cert .gold{color:#b08b2e;font-weight:800;letter-spacing:2px;font-size:12px}.cert h2{color:var(--navy);margin:8px 0}
.hint{font-size:11px;color:var(--mut);margin-top:4px}
.pill{display:inline-block;font-size:10.5px;border-radius:10px;padding:2px 8px;margin-left:6px}
.pill.ok{background:#e4f3e8;color:var(--ok)}.pill.no{background:#f0e2dd;color:var(--warn)}
.kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0}
.kpi .k{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--soft)}
.kpi .k b{font-size:20px;color:var(--navy);display:block}.kpi .k small{font-size:11px;color:var(--mut)}
@media(max-width:760px){.wrap{grid-template-columns:1fr}.rail{position:static}}
</style></head>

<div class="top"><b>커리어사관학교</b><span class="tag">MVP 프로토타입</span>

  <div class="card"><div id="view"></div></div>
</div>

function nav(){

// ---------- matching engine ----------
function scoreJobs(){
  let crit=S.match.crit||[];
  return JOBS.map(j=>{
    let overlap=j.tags.filter(t=>crit.includes(t)).length;
    let s=overlap*10 + (j.out==="성장"?4:j.out==="유지"?1:0);
    return {j,s,overlap}}).sort((a,b)=>b.s-a.s);
}
function jobFit(j){let c=S.match.crit||[];return j.tags.filter(t=>c.includes(t)).length}

const PUFF=["최고","최선","열정적으로","누구보다","완벽","엄청난","뛰어난","압도적","항상","무조건"];
function aiResume(e){
  let act=e.action||"___", res=e.result||"___", role=e.role||"___";
  return `· ${e.name||"경험"} — ${role} 담당, ${act}하여 ${res} (${(e.skill||"직무역량")})`;
}
function aiStar(e,job){
  return `[STAR 초안 · 지원직무: ${job||"___"}]\n`+
  `S(상황) ${e.name||"___"} 상황에서\n`+
  `T(역할) ${e.role||"___"} 역할을 맡아\n`+
  `A(행동) ${e.action||"___"}했고\n`+
  `R(결과) ${e.result||"___"}.\n`+
  `→ 이 경험으로 기른 ${(e.skill||"역량")}을 ${job||"지원 직무"}에서 발휘하겠습니다.`;
}
function aiPuffCheck(txt){
  let hit=PUFF.filter(p=>(txt||"").includes(p));
  return hit.length?`⚠ 과장 의심 표현: ${hit.join(", ")} — 구체적 사실·수치로 바꾸세요.`:"과장 표현이 발견되지 않았습니다. 좋아요.";
}
function aiQuestions(job,exp){
  return [`[기본] 1분 자기소개를 해주세요.`,
    `[지원동기] 왜 ${job||"이 직무"}에 지원했나요?`,

    `[태도] 실수했을 때 어떻게 대처하나요?`].join("\n");
}

  return `당신은 <b>${lvl} 단계</b>입니다. ${q.job==='있다'?'관심 직무를 더 구체화하고':'관심 직무를 찾고'}, 내 경험을 서류와 면접 답변으로 바꾸는 연습이 필요합니다.`;}
function setPre(k,v){S.pre[k]=v;save(1);render()}
function submitPre(){if(!S.pre.want){alert("문항에 응답해 주세요");return}award("pre");go("ready")}

// Ready
function vReady(){let r=S.ready;
  let items=[["시간과 약속","약속 시간을 잘 지킨다"],["시간과 약속","해야 할 일을 미루지 않는다"],
   ["질문과 확인","모르는 것을 질문할 수 있다"],["책임감","맡은 일을 끝까지 해본 경험이 있다"],
   ["강점 인식","내가 잘하는 것을 1가지 이상 설명할 수 있다"],["취업 목표","관심 직무·분야가 1개 이상 있다"]];
  let body=items.map((it,i)=>{let v=r.check[i];
    let sc=["매우","보통","부족"].map(o=>`<span class="${v===o?'on':''}" onclick="S.ready.check[${i}]='${o}';save(1);render()">${o}</span>`).join("");
    return `<div class="chk"><span style="flex:1"><b style="color:#1f3864">${it[0]}</b> · ${it[1]}</span><span class="scaleopt">${sc}</span></div>`}).join("");
  let cnt=Object.keys(r.check).length;
  return head("S3","Ready — 직장인 모드로","‘학생’에서 ‘예비 직장인’으로 태도를 전환합니다.")+
   `<div class="msg">회사는 완벽한 사람보다 <b>믿고 함께 일할 수 있는 사람</b>을 원합니다.</div>
    <div class="lbl">직장인 모드 체크리스트 (${cnt}/6)</div>${body}
    <div class="lbl">직장인 모드 선언문</div>
    <label class="q">바꾸고 싶은 습관 1가지</label><input type="text" value="${esc(r.decl.habit)}" oninput="S.ready.decl.habit=this.value">
    <label class="q">그 이유</label><input type="text" value="${esc(r.decl.why)}" oninput="S.ready.decl.why=this.value">
    <label class="q">이번 주 실천할 행동</label><input type="text" value="${esc(r.decl.act)}" oninput="S.ready.decl.act=this.value">
    ${actbar(`<button class="btn g" onclick="submitReady()">제출 → 뱃지</button>`)}`;
}
function submitReady(){let r=S.ready;if(Object.keys(r.check).length<6||!r.decl.habit){alert("체크리스트 6개와 선언문(습관)을 완성하세요");return}save(1);popBadge("ready")}

// Explore
function vExplore(){let e=S.explore;
  let f=(k,l,ph)=>`<label class="q">${l}</label><input type="text" value="${esc(e.posting[k])}" oninput="S.explore.posting.${k}=this.value" placeholder="${ph||''}">`;
  let risks=["담당업무가 구체적인가","근무시간이 명확한가","급여(기준)가 안내되었는가","회사 정보가 확인되는가","‘초보가능·고수익’만 과도하게 강조하지 않는가"];
  let rb=risks.map((t,i)=>`<div class="chk"><label style="flex:1"><input type="checkbox" ${e.risk[i]?'checked':''} onchange="S.explore.risk[${i}]=this.checked;save(1)"> ${t}</label></div>`).join("");
  let rows=(e.ready3||[["","",""]]).map((r,i)=>`<tr>
    <td><input value="${esc(r[0])}" oninput="S.explore.ready3[${i}][0]=this.value"></td>
    <td><input value="${esc(r[1])}" oninput="S.explore.ready3[${i}][1]=this.value"></td>
    <td><input value="${esc(r[2])}" oninput="S.explore.ready3[${i}][2]=this.value"></td></tr>`).join("");
  return head("S4","Explore — 채용공고 읽기","공고를 분석해 ‘내가 준비할 것’을 찾습니다.")+
   `<div class="msg">채용공고는 <b>회사가 원하는 사람과 내가 준비할 것</b>을 알려주는 힌트지입니다.</div>
    <div class="lbl">채용공고 분석표</div>
    <div class="row">${f('co','회사명')}${f('job','모집 직무')}</div>
    ${f('duty','담당업무')}${f('req','자격요건')}${f('pref','우대사항')}
    <div class="row">${f('cond','근무조건')}${f('q','면접 예상 질문 1개')}</div>
    <div class="lbl">좋은 공고 / 위험 신호 체크</div>${rb}
    <div class="lbl">나의 준비도 <button class="btn" style="padding:3px 9px;font-size:11px" onclick="S.explore.ready3.push(['','','']);save(1);render()">+행</button></div>
    <table><tr><th>공고가 요구하는 것</th><th>내가 가진 것</th><th>더 준비할 것</th></tr>${rows}</table>
    ${actbar(`<button class="btn g" onclick="submitExplore()">제출 → 뱃지</button>`)}`;
}
function submitExplore(){let e=S.explore;let r3=(e.ready3||[]).some(r=>r[2]&&r[2].trim());
  if(!e.posting.co||!e.posting.duty||!r3){alert("회사명·담당업무와 ‘더 준비할 것’ 1개 이상을 작성하세요");return}save(1);popBadge("explore")}

// Match (real engine)
let matchView="crit";
function vMatch(){
  if(matchView==="crit")return mCrit();
  if(matchView==="explore")return mExplore();
  if(matchView==="table")return mTable();
  return mEval();
}
function mTab(){return `<div class="chips" style="margin:6px 0 12px">
  ${[["crit","① 기준"],["explore","② 직업 탐색"],["table","③ 매칭표"],["eval","④ TOP3 평가"]].map(([k,t])=>`<span class="chip ${matchView===k?'sel':''}" onclick="matchView='${k}';render()">${t}</span>`).join("")}</div>`}
function mCrit(){let c=S.match.crit||[];
  let chips=TAGS.map(t=>`<span class="chip ${c.includes(t)?'sel':''}" onclick="toggleCrit('${t}')">${t}</span>`).join("");
  return head("S5","Match — 나에게 맞는 직무 찾기","신규 직업 DB(80직종)에서 나와 맞는 직무를 찾습니다.")+mTab()+
   `<div class="lbl">중요하게 보는 기준 (최대 3개 선택) — ${c.length}/3</div><div class="chips">${chips}</div>
    <div class="hint">선택한 기준이 직업 DB의 ‘적합 태그’와 매칭되어 추천 점수를 만듭니다.</div>
    ${actbar(`<button class="btn p" onclick="if((S.match.crit||[]).length){matchView='explore';render()}else alert('기준을 1개 이상 고르세요')">직업 탐색 →</button>`)}`;
}
function toggleCrit(t){let c=S.match.crit;let i=c.indexOf(t);if(i>=0)c.splice(i,1);else{if(c.length>=3){alert("최대 3개");return}c.push(t)}save(1);render()}
function mExplore(){
  let ranked=scoreJobs();let saved=S.match.saved||[];
  let filt=document.getElementById; // noop
  let list=ranked.slice(0,12).map(({j,s})=>{
    let on=saved.find(x=>x.id===j.id);
    return `<div class="jobcard"><span class="score">적합 ${s}</span><h4>${j.name}</h4>
      <div class="meta">${j.cat} · 연봉 ${j.salr}만원 · 전망 ${j.out}</div>
      <div class="meta">${j["def"]}</div>
      <div class="meta">필요역량: ${j.skills.join(", ")} / 자격증: ${j.certs.join(", ")}</div>
      <div>${j.tags.map(t=>`<span class="tagm">${t}</span>`).join("")}</div>
      <div style="margin-top:8px"><button class="btn ${on?'':'p'}" onclick="saveJob('${j.id}')">${on?'저장됨 ✓ (해제)':'관심 직무 저장'}</button></div></div>`}).join("");
  return head("S5","Match — 직업 탐색","기준에 맞춰 추천된 직업입니다. 관심 직무를 최대 3개 저장하세요.")+mTab()+
   `<div class="lbl">추천 직업 (저장 ${saved.length}/3) · 선택 기준: ${(S.match.crit||[]).join(", ")||"-"}</div>${list}
    ${actbar(`<button class="btn p" onclick="if((S.match.saved||[]).length){matchView='table';render()}else alert('관심 직무를 1개 이상 저장하세요')">매칭표 →</button>`)}`;
}
function saveJob(id){let s=S.match.saved;let i=s.findIndex(x=>x.id===id);
  if(i>=0)s.splice(i,1);else{if(s.length>=3){alert("최대 3개");return}let j=JOBS.find(x=>x.id===id);s.push({id:j.id,name:j.name})}save(1);render()}
function mTable(){let saved=S.match.saved||[];if(!saved.length)return head("S5","Match — 매칭표","")+mTab()+"<p>먼저 관심 직무를 저장하세요.</p>";
  let job=JOBS.find(x=>x.id===saved[0].id);let m=S.match;m.table=m.table||{};
  let rows=job.skills.map((sk,i)=>`<tr><td>${sk}</td>
    <td><input value="${esc((m.table[i]||{}).exp)}" oninput="setTbl(${i},'exp',this.value)" placeholder="연결되는 내 경험"></td>
    <td><input value="${esc((m.table[i]||{}).ev)}" oninput="setTbl(${i},'ev',this.value)" placeholder="근거"></td></tr>`).join("");
  return head("S5","Match — 내 직무 매칭표",`1순위 후보 «${job.name}»에 필요한 역량과 내 경험을 연결하세요.`)+mTab()+
   `<table><tr><th>직무에 필요한 역량</th><th>내가 가진 경험</th><th>근거</th></tr>${rows}</table>
    ${actbar(`<button class="btn p" onclick="matchView='eval';render()">TOP3 평가 →</button>`)}`;
}
function setTbl(i,k,v){S.match.table=S.match.table||{};S.match.table[i]=S.match.table[i]||{};S.match.table[i][k]=v;save(1)}
function mEval(){let saved=S.match.saved||[];if(!saved.length)return head("S5","Match — TOP3 평가","")+mTab()+"<p>먼저 관심 직무를 저장하세요.</p>";
  let ax=["관심도","전공연결","보유역량","준비가능성","근무환경"];let ev=S.match.eval;
  let rows=saved.map(s=>{let tot=ax.reduce((a,x)=>a+(+((ev[s.id]||{})[x])||0),0);
    let cells=ax.map(x=>`<td><input style="width:46px" value="${(ev[s.id]||{})[x]||''}" oninput="setEval('${s.id}','${x}',this.value)" placeholder="1-5"></td>`).join("");
    return `<tr><td><b>${s.name}</b></td>${cells}<td><b>${tot}</b></td></tr>`}).join("");
  let best=saved.map(s=>({n:s.name,t:ax.reduce((a,x)=>a+(+((ev[s.id]||{})[x])||0),0)})).sort((a,b)=>b.t-a.t)[0];
  return head("S5","Match — 직무 TOP3 평가표","5개 기준으로 점수를 매겨 1순위를 정합니다.")+mTab()+
   `<table><tr><th>직무</th>${ax.map(x=>`<th>${x}</th>`).join("")}<th>합계</th></tr>${rows}</table>
    ${best&&best.t?`<div class="msg">현재 1순위 제안: <b>${best.n}</b> (${best.t}점). 아래에 선택 이유를 적으세요.</div>`:""}
    <label class="q">1순위 직무와 선택 이유</label><textarea oninput="S.match.reason=this.value">${esc(S.match.reason)}</textarea>
    ${actbar(`<button class="btn g" onclick="submitMatch()">제출 → 뱃지</button>`)}`;
}
function setEval(id,k,v){S.match.eval[id]=S.match.eval[id]||{};S.match.eval[id][k]=v.replace(/[^0-5]/g,'');save(1)}
function submitMatch(){if((S.match.saved||[]).length<1||!S.match.reason){alert("관심 직무 저장과 1순위 선택 이유를 완성하세요");return}S.match.top1=S.match.saved[0].name;save(1);popBadge("match")}

// Prove
function vProve(){let p=S.prove;p.exps=p.exps.length?p.exps:[{}];
  let job=S.match.top1||(S.match.saved[0]||{}).name||"";
  let cur=p.exps[p.cur||0]||{};p.cur=p.cur||0;
  let pickers=p.exps.map((e,i)=>`<span class="chip ${i===p.cur?'sel':''}" onclick="S.prove.cur=${i};save(1);render()">경험 ${i+1}</span>`).join("")
    +`<span class="chip" onclick="S.prove.exps.push({});S.prove.cur=S.prove.exps.length-1;save(1);render()">+추가</span>`;
  let ef=(k,l)=>`<label class="q">${l}</label><input type="text" value="${esc(cur[k])}" oninput="setExp('${k}',this.value)">`;
  return head("S6","Prove — 경험을 서류로","경험을 지원 직무와 연결되는 이력서·자소서로 바꿉니다.")+
   `<div class="msg">서류는 자랑하는 글이 아니라 <b>내가 이 일을 해낼 수 있다는 근거</b>입니다. (지원직무: ${job||"-"})</div>
    <div class="lbl">경험 인벤토리</div><div class="chips">${pickers}</div>
    ${ef('name','경험명 (예: 학교 축제 스태프)')}
    <div class="row">${ef('role','맡은 역할')}${ef('skill','연결 직무역량')}</div>
    ${ef('action','내가 한 행동')}${ef('result','결과·배운 점')}
    <div class="ai"><h4>AI 코치 — 정리·피드백 전용 (대필 금지)</h4>
      <div class="out">${esc(aiResume(cur))}\n\n${esc(aiStar(cur,job))}</div>
      <div class="out" style="margin-top:8px">과장 점검: ${esc(aiPuffCheck((cur.action||"")+(cur.result||"")))}</div>
      <div class="caution">⚠ AI 문장은 참고용입니다. 실제 경험과 다르거나 면접에서 설명할 수 없는 내용은 쓰지 마세요. 아래에 ‘내 말로’ 고쳐 쓰세요.</div></div>
    <div class="lbl">이력서 핵심 (내 말로)</div>
    <div class="row"><input placeholder="희망 직무" value="${esc(p.resume.job)}" oninput="S.prove.resume.job=this.value">
      <input placeholder="보유 자격증" value="${esc(p.resume.cert)}" oninput="S.prove.resume.cert=this.value"></div>
    <textarea placeholder="경력·활동 / 강점 키워드" oninput="S.prove.resume.body=this.value">${esc(p.resume.body)}</textarea>
    <div class="lbl">자기소개서 (지원동기 등 1문항, 내 말로)</div>
    <textarea placeholder="STAR 구조로 작성" oninput="S.prove.cover.text=this.value">${esc(p.cover.text)}</textarea>
    ${actbar(`<button class="btn g" onclick="submitProve()">제출 → 뱃지</button>`)}`;
}
function setExp(k,v){let p=S.prove;p.exps[p.cur][k]=v;save(1)}
function submitProve(){let p=S.prove;let okExp=p.exps.filter(e=>e.name&&e.action).length>=1;
  if(!okExp||!p.resume.body||!p.cover.text){alert("경험 1개(이름·행동)와 이력서 본문·자소서를 작성하세요");return}save(1);popBadge("prove")}

// Practice
function vPractice(){let pr=S.practice;let job=S.match.top1||"";let exp=(S.prove.exps[0]||{}).name||"";
  let it=(S.practice.intro=S.practice.intro||{});
  return head("S7","Practice — 면접 답변과 태도","자소서 경험을 면접 답변으로 바꾸고 태도를 연습합니다.")+
   `<div class="ai"><h4>AI 코치 — 예상 질문 생성</h4><div class="out">${esc(aiQuestions(job,exp))}</div>
     <div class="caution">⚠ 생성된 질문은 참고용. 답변은 본인의 실제 경험으로 준비하세요.</div></div>

    <div class="lbl">면접 태도 체크</div>
    ${["가볍게 인사했다","시선을 피하지 않았다","말끝을 흐리지 않았다","모르는 질문에 솔직히 답했다","감사 인사를 했다"].map((t,i)=>`<div class="chk"><label style="flex:1"><input type="checkbox" ${(S.practice.att||{})[i]?'checked':''} onchange="S.practice.att[${i}]=this.checked;save(1)"> ${t}</label></div>`).join("")}
    ${actbar(`<button class="btn g" onclick="submitPractice()">제출 → 뱃지</button>`)}`;

// Launch
function vLaunch(){let l=S.launch;
  let mocks=[["○○물류 사무보조","경영·사무·금융"],["△△디자인 운영보조","디자인·콘텐츠"],["□□테크 생산직","기계·금속"]];

     <button class="btn ${l.sel===n?'':'p'}" onclick="S.launch.sel='${n}';save(1);render()">${l.sel===n?'선택됨 ✓':'이 공고로 지원'}</button></div>`).join("");
  return head("S8","Launch — 모의채용 데이","준비한 자료로 실제처럼 지원하고 회고합니다.")+
   `<div class="lbl">모의 채용공고 선택</div>${cards}

      <input placeholder="지원 이유" value="${esc((l.apply||{}).why)}" oninput="S.launch.apply.why=this.value"></div>
    <div class="lbl">최종 회고 리포트</div>
    <label class="q">면접에서 잘한 점 / 보완할 점</label><textarea oninput="S.launch.retro.fb=this.value">${esc((l.retro||{}).fb)}</textarea>
    <label class="q">가장 먼저 실천할 행동 1가지</label><input type="text" value="${esc((l.retro||{}).next)}" oninput="S.launch.retro.next=this.value">

// badge popup
function popBadge(step){award(step);let v=document.getElementById("view");let b=BADGE[step];
  v.innerHTML=`<div class="badgepop"><div class="seal">${b[0]}<br>Badge</div><h2 style="color:#1f3864">${b[0]} Badge</h2>
   <p style="color:#6b7682">${b[1]}</p>
   <div class="acts" style="justify-content:center;border:none"><button class="btn p" onclick="nextStep('${step}')">다음 단계 →</button></div></div>`;nav();}
function nextStep(step){let i=STEPS.findIndex(s=>s[0]===step);go(STEPS[Math.min(i+1,STEPS.length-1)][0])}

// done
function vDone(){let n=S.done.filter(d=>d!=='done').length;let all=n>=7;
  let badges=Object.keys(BADGE).map(k=>`<span class="chip ${S.badges[k]?'sel':''}">${BADGE[k][0]}${S.badges[k]?' ✓':''}</span>`).join("");
  let pre=S.pre,lvl=pre.want?preSummary():"-";
  return head("S9","사후 설문 / 수료","성장을 확인하고 수료합니다.")+
   `<div class="kpi"><div class="k"><b>${n}/6</b><small>완료 미션</small></div>
     <div class="k"><b>${(S.match.saved||[]).length}</b><small>탐색 직무</small></div>
     <div class="k"><b>${S.match.top1||'-'}</b><small>1순위 직무</small></div></div>
    <div class="lbl">획득 뱃지</div><div class="chips">${badges}</div>
    ${all?`<div class="cert"><div class="gold">CAREER READY BADGE</div><h2>학생에서 현장 인재로 성장 완료</h2>
      <p style="color:#5a636e;font-size:13px;max-width:460px;margin:6px auto;line-height:1.7">축하합니다! Ready부터 Launch까지 모든 미션을 완료했습니다. 이제 경험을 직무와 연결하고 서류·면접에서 설명할 수 있는 첫 출근 준비자입니다.</p></div>
      <div class="acts"><span class="sp"></span><button class="btn" onclick="window.print()">수료증 인쇄</button></div>`
     :`<div class="msg">아직 완료하지 않은 미션이 있습니다. 좌측에서 이어서 진행하세요. (완료 ${n}/6)</div>`}
    <div class="lbl" style="margin-top:14px">최종 리포트 요약</div>
    <div class="jobcard"><div class="meta">진단: ${lvl}</div>
      <div class="meta">1순위 직무: ${S.match.top1||'-'} / 선택 이유: ${esc(S.match.reason)||'-'}</div>
      <div class="meta">다음 실천: ${esc((S.launch.retro||{}).next)||'-'}</div></div>`;
}
function exportData(){let blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
  let a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="career_progress.json";a.click()}
function resetAll(){if(confirm("모든 진행을 초기화할까요?")){S=fresh();save(1);go("pre")}}
render();
</script></body></html>
